<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Travlog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Travlog</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
    <script type="module" src="install.js"></script>
  </head>
  <body>
    <div id="probe"></div>
    <div id="map"></div>

    <button id="searchBar" class="glass" aria-label="Search">
      <svg viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m15.5 15.5 5 5" />
      </svg>
      <span>Search Vietnam</span>
    </button>

    <div id="fabs" class="glass">
      <button id="citiesBtn" aria-label="Jump to a city">
        <svg viewBox="0 0 24 24">
          <path d="m12 4 8 4.5-8 4.5-8-4.5z" />
          <path d="m4 12.5 8 4.5 8-4.5" />
          <path d="m4 16.5 8 4.5 8-4.5" />
        </svg>
      </button>
    </div>

    <div id="dim"></div>

    <div id="sheet">
      <div class="head" id="head">
        <div class="grabber"></div>
        <div class="title">
          <h1 id="dayTitle">Travlog</h1>
          <p id="daySub">Loading…</p>
        </div>
        <div class="chips" id="chips"></div>
      </div>
      <div class="scroll" id="scroll">
        <ul class="list" id="stops"></ul>
        <p class="foot">Tap a stop to see it on the map.</p>
      </div>
    </div>

    <div id="card" class="card"></div>

    <div id="search" class="search">
      <div class="search-top">
        <label class="search-field">
          <svg viewBox="0 0 24 24">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="m15.5 15.5 5 5" />
          </svg>
          <input
            id="q"
            type="search"
            placeholder="Search Vietnam"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="search"
          />
        </label>
        <button id="qCancel" class="link">Cancel</button>
      </div>
      <div class="search-results" id="results"></div>
    </div>

    <div id="actionDim" class="action-dim"></div>
    <div id="cities" class="action">
      <div class="action-group">
        <p class="action-title">Show on map</p>
        <button data-city="hanoi">Hanoi</button>
        <button data-city="ninhbinh">Ninh Binh</button>
        <button data-city="phuquoc">Phu Quoc</button>
        <button data-city="vietnam">All of Vietnam</button>
      </div>
      <button class="action-cancel" id="citiesCancel">Cancel</button>
    </div>

    <div id="alert" class="alert">
      <div class="alert-box">
        <p class="alert-title" id="alertTitle"></p>
        <p class="alert-msg" id="alertMsg"></p>
        <div class="alert-btns">
          <button id="alertCancel">Cancel</button
          ><button id="alertOk" class="destructive">Delete</button>
        </div>
      </div>
    </div>

    <div id="toast" class="glass">
      <span id="toastMsg"></span><button id="toastBtn"></button>
    </div>

    <div id="install" class="install glass">
      <img src="icon-192.png" alt="" />
      <div class="txt">
        <div class="install-title">Install Travlog</div>
        <div class="meta">Opens full-screen, like an app</div>
      </div>
      <button id="installBtn" class="install-btn">Install</button>
      <button id="installX" class="x" aria-label="Not now">×</button>
    </div>

    <div id="installGuide" class="card">
      <div class="card-head">
        <div class="txt"><div class="card-title">Add to Home Screen</div></div>
      </div>
      <ol class="steps" id="guideSteps"></ol>
      <button class="primary" id="guideDone">Done</button>
    </div>

    <div id="welcome" hidden>
      <form id="join" autocomplete="off" novalidate>
        <div class="logo">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"
            />
            <circle cx="12" cy="10" r="2.4" />
          </svg>
        </div>
        <h1>Travlog</h1>
        <p class="lead">Enter the trip passcode and your name.</p>
        <div class="fields">
          <input
            id="pass"
            type="password"
            placeholder="Passcode"
            autocomplete="off"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
          />
          <input
            id="name"
            type="text"
            placeholder="Your name"
            maxlength="30"
            autocomplete="off"
            autocapitalize="words"
            autocorrect="off"
            spellcheck="false"
          />
        </div>
        <p id="joinError" class="error"></p>
        <button type="submit" id="joinBtn" class="primary">Join</button>
      </form>
    </div>
  </body>
</html>
